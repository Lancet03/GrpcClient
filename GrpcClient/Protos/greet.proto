syntax = "proto3";

option csharp_namespace = "Grpc";

package greet;

// The greeting service definition.
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc SayHelloStream (stream HelloRequest) returns (stream HelloReply);
  rpc GetMetrics (MetrixRequest) returns (MetricsResponse);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

message MetrixRequest {

}

message MetricsResponse {
  float cpu_usage = 1;
  float available_memory_mb = 2;
  float total_memory_mb = 3;
  float free_disk_space_gb = 4;
  float total_disk_space_gb = 5;
}
